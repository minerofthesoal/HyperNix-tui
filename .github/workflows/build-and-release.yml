name: build-and-release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.70.3)'
        required: true

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]  # hyperNix requires 3.10+
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (for textual / Linux TUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libffi-dev libssl-dev build-essential

      - name: Install pip, build, and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-asyncio ruff

      - name: Install package
        run: |
          pip install . || pip install --no-deps .

      - name: Lint
        run: ruff check hypercli || true

      - name: Test
        run: pytest -q tests/

      - name: Build wheel (only on 3.11 to avoid duplicate artifacts)
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Upload artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: hypercli-dist
          path: dist/*

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}  # Explicitly set the tag name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --disable-progress-bar \
            --username __token__ \
            --password "$PYPI_API_TOKEN" \
            dist/*
